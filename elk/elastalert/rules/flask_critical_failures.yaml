# Правило: любой CRITICAL лог Flask → немедленный алерт
# CRITICAL означает провал фоновой задачи RQ (daily_tasks, платежи, auto-cancel и т.д.)
# Требует немедленной проверки — это сбой бизнес-логики, не внешней зависимости.
name: "Flask CRITICAL failure"
type: any

index: flask-app*

filter:
  - term:
      log.level: "CRITICAL"

realert:
  minutes: 60

alert: telegram
telegram_bot_token: "${HEALTHCHECK_BOT}"
telegram_room_id: "${TELEGRAM_ALERTS_GROUP_ID}"

alert_text: |
  🆘 <b>Flask CRITICAL — Marka Service</b>

  Провал критической задачи!

  <b>Модуль:</b> <code>{0}</code>
  <b>Функция:</b> <code>{1}</code>
  <b>Сообщение:</b> <code>{2}</code>

  Kibana → Discover → <code>flask-app-*</code>, фильтр: <code>log.level: CRITICAL</code>
alert_text_args:
  - log.logger
  - log.function
  - log.message_text
alert_text_type: alert_text_only
telegram_parse_mode: html
