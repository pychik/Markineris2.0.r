user nginx;
worker_processes auto;


events {
    worker_connections 1024;
    use epoll;
}

http {
    server_tokens off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Workaround for TLS handshake stalls in affected client networks.
    ssl_protocols TLSv1.2;

    sendfile on;

    client_max_body_size 100M;

    proxy_connect_timeout 15;
    proxy_send_timeout 300;
    proxy_read_timeout 300;

    # Allow normal CRM request bursts, including users sharing a public IP.
    limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit_per_ip:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    limit_conn_status 429;
    limit_req_status 429;

    map $request_uri $loggable {
        ~/static  0;
        ~/favicon.ico  0;
        default 1;
    }

    server {
         listen 80;
         server_name marka-service.ru www.marka-service.ru;

         return 301 https://$host$request_uri;
    }
    server {
        server_name marka-service.ru www.marka-service.ru;
        listen [::]:443 ssl;
        listen 443 ssl;
        http2 on;

        ssl_certificate /etc/ssl/certs/bundle.crt;
        ssl_certificate_key /etc/ssl/private/default.key;
        access_log /var/log/nginx/access.log combined if=$loggable;

        location @flask_app {
            proxy_pass http://flask_app:5005;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;

        }

        location ^~ /static/ {
            # Проксируем запросы на MinIO-сервер
            proxy_pass http://minio:9000/static/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location @maintenance {
            root /usr/share/nginx/html;
            try_files $uri /maintenance.html =404;
        }

        location = /429.html {
            # Проксируем запросы на MinIO-сервер
            proxy_pass http://minio:9000/static/response_pages/429.html;
            add_header Retry-After: 5;
            internal;
            log_not_found off;
        }

        location = /app/health {
            if (-f /app/maintenance/maintenance.flag) {
                add_header Content-Type application/json;
                return 200 '{"status":"maintenance"}';
            }
            proxy_pass http://flask_app:5005;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # Keep the existing limits on authentication and registration routes.
        location ~ ^/(login|login_post|logout|sign_up|send_verification_code|verify_sign_up_phone_code|captcha/refresh)(/|$) {
            if (-f app/maintenance/maintenance.flag) {
                return 503;
            }
            limit_req zone=auth_limit_per_ip burst=5 nodelay;
            limit_conn conn_limit_per_ip 10;
            try_files $uri $uri/ @flask_app;
        }

        location / {
            if (-f app/maintenance/maintenance.flag) {
                return 503;
            }
            limit_req zone=req_limit_per_ip burst=40 nodelay;
            limit_conn conn_limit_per_ip 10;
            try_files $uri $uri/ @flask_app;
        }

        error_page 404 /404.html;
        error_page 503 @maintenance;
        error_page 500 502 504 /50x.html;
        error_page 429 /429.html;
    }

}