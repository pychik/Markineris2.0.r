  <div class="pc-crm-search-tools d-flex align-items-stretch gap-3 flex-wrap">
    <fieldset class="pc-crm-tool-group pc-crm-search-group">
      <legend>Поиск</legend>
      <div class="pc-crm-tool-content">
    <form onsubmit="return crmSearchCardSubmit(event)" class="pc-crm-search-form">
      <div class="input-group">
        <input
          id="crm-search-card-input"
          type="text"
          class="form-control"
          placeholder="Номер карточки"
          autocomplete="off"
          onkeydown="crmSearchCardKeyHandler(event)"
        >
        <button class="btn btn-warning pc-crm-search-icon-btn" type="submit" title="Найти" aria-label="Найти">
          <svg xmlns="http://www.w3.org/2000/svg"
               width="16"
               height="16"
               fill="currentColor"
               class="bi bi-search"
               viewBox="0 0 16 16"
               aria-hidden="true">
            <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
          </svg>
        </button>
        <button
          class="btn btn-outline-secondary pc-crm-search-icon-btn"
          type="button"
          onclick="crmSearchCardClear()"
          title="Очистить (Esc)"
          aria-label="Очистить"
        >✕</button>
      </div>

      <!-- режим поиска -->
      <div class="form-check form-switch crm-account-search-switch pc-crm-search-mode-toggle mt-2">
        <input
          class="form-check-input"
          type="checkbox"
          role="switch"
          id="crm-search-by-article"
          onchange="crmSearchModeChanged()"
        >
        <label class="form-check-label" for="crm-search-by-article" id="crm-search-mode-label"
               title="Переключить поиск по номеру карточки или артикулу; для парфюма — по торговой марке">
          По номеру карточки
        </label>
      </div>

    </form>
      </div>
    </fieldset>

    {% if current_user.role == "supermanager" or current_user.role == "superuser" %}
      <fieldset class="pc-crm-tool-group pc-crm-manager-group">
        <legend>Работа с операторами</legend>
        <div class="pc-crm-tool-content">
      <div class="pc-crm-manager-tools d-flex flex-column align-items-stretch">
        <div class="pc-crm-filter-row">
        <label class="pc-crm-tool-label" for="selectManager">Фильтр</label>
        <select class="form-control form-control-sm" id="selectManager" onchange="pcFilterManager()"
                title="Фильтр карточек по оператору">
          <option value="" {% if not filtered_manager_id %}selected{% endif %}>Все операторы</option>
          {% for m in managers_list %}
            <option value="{{ m[0] }}" {% if filtered_manager_id == m[0] %}selected{% endif %}>
              {{ m[1] }}
            </option>
          {% endfor %}
        </select>

        </div>

        <div class="pc-crm-assignment-section">
        <label class="visually-hidden" for="pc-bulk-assign-manager-select">Оператор для назначения карточек</label>
        <div class="pc-crm-assignment-row">
        <select class="form-control form-control-sm" id="pc-bulk-assign-manager-select"
                onchange="pcBulkAssignManagerChanged()"
                title="Оператор для назначения">
          <option value="">Назначить оператора</option>
          {% for m in managers_list %}
            <option value="{{ m[0] }}">{{ m[1] }}</option>
          {% endfor %}
        </select>

          <button type="button"
                  class="btn btn-sm btn-outline-warning"
                  id="pc-bulk-assign-start"
                  onclick="pcSetBulkAssignMode(true)">
            Назначить
          </button>
        </div>

          <div id="pc-bulk-assign-panel" class="d-none d-flex align-items-center gap-2 flex-wrap">
            <span class="small text-muted">Выбрано: <b id="pc-bulk-assign-count">0</b></span>
            <button type="button" class="btn btn-sm btn-warning" onclick="pcBulkAssignSelected()">OK</button>
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="pcSetBulkAssignMode(false)">×</button>
          </div>
        </div>
      </div>
        </div>
      </fieldset>
    {% endif %}

  </div>
