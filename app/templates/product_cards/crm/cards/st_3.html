<div class="crm__col">
  <div class="orders">
    <h2 class="orders__title">
      На модерации <span id="in_moderation_cards_qty">({{ in_moderation_cards|length }})</span>
      {% if current_user.role != 'admin' %}
        <select id="in_moderation_company_select"
          class="form-select form-select-sm mt-2"
          style="width: 210px; display:inline-block;"
          data-bs-toggle="tooltip"
          data-bs-title="Фильтр по компании"
          onchange="pcReloadColumn('in_moderation')">
            <option value="">Все фирмы</option>
            {% for c in companies_pool %}
              <option value="{{ c.key }}">{{ c.inn }} {{ c.title or c.external_id }}</option>
            {% endfor %}
          </select>
        {% endif %}
      <img src="{{ url_for('static', filename='crm_mod/img/icons/download.svg') }}"
       role="button"
       width="18" height="18"
       class="ms-1 icon-grey-filter"
       data-bs-toggle="tooltip"
       data-bs-title="Скачать на модерации (по фирмам)"
       onclick="pcDownloadCompaniesByStatus('in_moderation')">
    <button type="button"
              class="btn btn-sm btn-outline-secondary ms-2 px-2 py-0"
              id="pc-bulk-start-in_moderation"
              data-bs-toggle="tooltip"
              data-bs-title="Выбрать несколько"
              onclick="pcToggleBulkMode('in_moderation')">
        ✓✓
      </button>
    </h2>
    <div class="d-none mb-2"
         id="pc-bulk-panel-in_moderation"
         style="display:flex; align-items:center; justify-content:center; gap:.5rem;">
      <span class="text-muted small me-2">
        Выбрано: <b id="pc-bulk-count-in_moderation">0</b>
      </span>
      <span role="button"
            class="text-muted"
            style="font-size:24px; line-height:1;"
            data-bs-toggle="tooltip"
            data-bs-title="Одобрить выбранные карточки"
            onclick="pcBulkMoveSelected('in_moderation', 'approved')">✓</span>
      <span role="button"
            class="text-muted"
            style="font-size:26px; line-height:1;"
            data-bs-toggle="tooltip"
            data-bs-title="Отмена"
            onclick="pcSetBulkMode('in_moderation', false)">×</span>
    </div>

    <div style="width:335px"></div>

    <div id="in_moderation_cards_main">
      <div class="orders__list" id="in_moderation_cards_list">
        {% include 'product_cards/crm/cards/updated_stages/_in_moderation_list.html' %}
      </div>
    </div>
  </div>
</div>
