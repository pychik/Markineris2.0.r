{% extends 'main/base_v2.html' %}

{% block main %}
<link rel="stylesheet" href="{{ url_for('static', filename='main_v2/css/categories/cosmetics.css', v='2') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='main_v2/css/categories/toys.css', v='1') }}">

<div class="container pb-4">
    <div class="front text-center">
        <h1 class="mb-5 fs-2">{{ page_title }}</h1>
    </div>

    <div class="row justify-content-center mb-5">
        <div class="col-12 col-lg-8">
            <label for="toys-category-search" class="form-label fw-semibold">
                Введите ТНВЭД или вид товара для определения категории
            </label>
            <input
                id="toys-category-search"
                type="text"
                class="form-control form-control-lg"
                placeholder="{{ search_placeholder }}"
                autocomplete="off"
            >
            <div id="toys-search-result" class="cosmetics-search-result is-empty" aria-live="polite"></div>
        </div>
    </div>

    <div class="row g-4 mb-4">
        {% for subcategory_item in toys_category_tiles %}
        <div class="col-12 col-md-6 col-lg-4">
            <a href="{{ url_for('toys.index', subcategory=subcategory_item.slug) }}" class="category-item text-center h-100">
                <div class="toys-category-icon-frame mx-auto" aria-hidden="true">
                    <img class="toys-category-icon" src="{{ url_for('static', filename=subcategory_item.icon, v='20260804-toys-doll-accessories') }}" alt="">
                </div>
                <div class="category-item__name text-center">
                    {{ subcategory_item.title }}
                </div>
            </a>
        </div>
        {% endfor %}
    </div>
</div>

<script>
    window.TOYS_SEARCH_INDEX = {{ toys_search_index | tojson | safe }};
</script>
<script src="{{ url_for('static', filename='main_v2/js/categories/toys.js', v='1') }}"></script>
{% endblock %}
