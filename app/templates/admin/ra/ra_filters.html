<div class="card border-0 shadow-sm mb-4" id="form_filters">
    <form class="card-body" id="reanimate_filters"
          onsubmit="event.preventDefault(); bck_get_users_reanimate(document.getElementById('user_response').dataset.url);">
        <div class="mb-3">
            <h5 class="mb-1">Период неактивности</h5>
            <p class="text-secondary mb-0">Показать клиентов без заказов за выбранный срок.</p>
        </div>
        <input type="hidden" id="reanimate_sort" name="sort_type" value="{{ sort_type }}">
        <div class="row g-3 align-items-end">
            <div class="col-12 col-sm-6">
                <label for="date_quantity" class="form-label">Количество</label>
                <input type="number" class="form-control" id="date_quantity" name="date_quantity"
                       min="1" max="{{ date_quant_max }}" value="{{ date_quantity }}" required
                       oninput="check_ra_filter_Validity(this)" aria-describedby="reanimate_quantity_hint">
                <div class="form-text" id="reanimate_quantity_hint">От 1 до {{ date_quant_max }}</div>
            </div>
            <div class="col-12 col-sm-6">
                <label for="date_type" class="form-label">Единица времени</label>
                <select class="form-select form-control" id="date_type" name="date_type" required>
                    {% for t in date_range_types %}
                    <option value="{{ t }}" {% if t == date_type %}selected{% endif %}>{{ t }}</option>
                    {% endfor %}
                </select>
                <div class="form-text">Срок с последнего заказа</div>
            </div>
        </div>
        <div class="form-check form-switch reanimate-empty-switch mt-3">
            <input class="form-check-input border border-warning" type="checkbox" role="switch"
                   id="include_without_orders" name="include_without_orders"
                   {% if include_without_orders %}checked{% endif %}>
            <label class="form-check-label" for="include_without_orders">Включать клиентов, которые ещё не заказывали</label>
        </div>
        <div class="d-flex flex-wrap gap-2 mt-3">
                <button type="submit" class="btn btn-accent">Показать клиентов</button>
                {% if current_user.role in ['superuser', 'm2r_admin'] and not u_id %}
                <button type="button" class="btn btn-outline-secondary"
                        onclick="get_users_reanimate_report_excel('{{ url_for('admin_control.bck_su_control_reanimate_excel') }}', '{{ csrf_token() }}')">
                    Скачать Excel
                </button>
                {% endif %}
        </div>
        <div class="small text-secondary mt-3" title="Списания — успешные оплаты заказов с баланса клиента, без вычета возвратов. Средний чек — списания / количество заказов.">Показатели заказов и транзакций — за всё время.</div>
    </form>
</div>
